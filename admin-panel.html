<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伺服电缆选型 - 后台管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #0a0e1a;
            color: #e0e6ed;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        h1 { font-size: 1.8rem; color: #00d4ff; }
        .subtitle { color: #6b7b9c; font-size: 0.85rem; }
        .logout-btn {
            padding: 6px 14px;
            background: rgba(255,107,107,0.1);
            border: 1px solid rgba(255,107,107,0.3);
            border-radius: 6px;
            color: #ff6b6b;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
        }
        .logout-btn:hover { background: rgba(255,107,107,0.2); }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card-title { font-size: 1.1rem; color: #00d4ff; margin-bottom: 16px; }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .setting-row:last-child { border-bottom: none; }
        .setting-label { color: #8b9dc3; }
        .switch { position: relative; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.1); border-radius: 26px; transition: 0.3s;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px;
            left: 3px; bottom: 3px; background: #6b7b9c; border-radius: 50%; transition: 0.3s;
        }
        input:checked + .slider { background: #00d4ff; }
        input:checked + .slider:before { transform: translateX(24px); background: #fff; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; color: #8b9dc3; font-size: 0.85rem; margin-bottom: 6px; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            color: #fff; font-size: 0.95rem; outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus, .input-group textarea:focus { border-color: #00d4ff; }
        .input-group textarea { min-height: 80px; resize: vertical; font-family: inherit; }
        .input-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
        .btn {
            padding: 10px 20px; background: linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%);
            border: none; border-radius: 6px; color: #fff; font-size: 0.9rem;
            cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,212,255,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        .btn-outline { background: transparent; border: 1px solid rgba(0,212,255,0.3); color: #00d4ff; }
        .btn-danger { background: rgba(255,107,107,0.2); border: 1px solid rgba(255,107,107,0.3); color: #ff6b6b; }
        .btn-block { width: 100%; margin-top: 10px; }
        .code-list { margin-top: 12px; }
        .code-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; background: rgba(0,0,0,0.2);
            border-radius: 6px; margin-bottom: 8px;
        }
        .code-text { font-family: monospace; color: #00d4ff; letter-spacing: 1px; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        .alert-success { background: rgba(81,207,102,0.1); border: 1px solid rgba(81,207,102,0.3); color: #51cf66; }
        .alert-warning { background: rgba(255,217,61,0.1); border: 1px solid rgba(255,217,61,0.3); color: #ffd93d; }
        .alert-error { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: #ff6b6b; }
        .alert-info { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3); color: #00d4ff; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            padding: 8px 16px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            color: #8b9dc3; cursor: pointer; transition: all 0.2s; user-select: none;
        }
        .tab.active { background: rgba(0,212,255,0.1); border-color: #00d4ff; color: #00d4ff; }
        .tab:hover { background: rgba(255,255,255,0.08); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .help-text { font-size: 0.75rem; color: #6b7b9c; margin-top: 4px; }
        .password-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            padding: 12px 20px; border-radius: 8px;
            font-size: 0.9rem; z-index: 1000;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
        }
        .toast-success { background: rgba(81,207,102,0.9); color: #fff; }
        .toast-error { background: rgba(255,107,107,0.9); color: #fff; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .saving-indicator { color: #6b7b9c; font-size: 0.8rem; margin-left: 8px; }
        .saving { color: #ffd93d; }
        .saved { color: #51cf66; }
        .small-input { width: 120px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>⚙️ 后台管理</h1>
                <p class="subtitle">伺服电缆选型工具 · 配置实时同步到服务器</p>
            </div>
            <a class="logout-btn" href="admin.html">退出登录</a>
        </div>

        <div class="alert alert-info" id="statusAlert">
            正在加载配置...
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="limit" onclick="showTab('limit')">查询限制</div>
            <div class="tab" data-tab="text" onclick="showTab('text')">网站文字</div>
            <div class="tab" data-tab="codes" onclick="showTab('codes')">解锁码</div>
            <div class="tab" data-tab="password" onclick="showTab('password')">修改密码</div>
        </div>

        <!-- Tab 1: 查询限制 -->
        <div class="tab-content active" id="tab-limit">
            <div class="card">
                <div class="card-title">查询限制设置</div>
                <div class="setting-row">
                    <div>
                        <div class="setting-label">启用查询限制</div>
                        <div class="help-text">关闭后所有用户可无限查询</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="limitEnabled" onchange="saveAll()">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-row">
                    <div>
                        <div class="setting-label">免费查询次数</div>
                    </div>
                    <input type="number" id="freeQueries" class="small-input" value="1" min="0" max="100" onchange="saveAll()">
                </div>
                <div class="setting-row">
                    <div>
                        <div class="setting-label">客服微信号</div>
                    </div>
                    <input type="text" id="wechatId" class="small-input" value="zzh250058" onchange="saveAll()">
                </div>
            </div>
        </div>

        <!-- Tab 2: 网站文字 -->
        <div class="tab-content" id="tab-text">
            <div class="card">
                <div class="card-title">网站标题与副标题</div>
                <div class="input-group">
                    <label>网站标题</label>
                    <input type="text" id="siteTitle" placeholder="显示在页面顶部的标题" onchange="saveAll()">
                </div>
                <div class="input-group">
                    <label>网站副标题</label>
                    <input type="text" id="siteSubtitle" placeholder="标题下方的描述文字" onchange="saveAll()">
                </div>
            </div>

            <div class="card">
                <div class="card-title">弹窗文字（次数用完提示）</div>
                <div class="input-group">
                    <label>弹窗标题</label>
                    <input type="text" id="modalTitle" placeholder="弹窗顶部标题" onchange="saveAll()">
                </div>
                <div class="input-group">
                    <label>弹窗正文</label>
                    <textarea id="modalText" rows="3" placeholder="弹窗内的提示内容，支持换行" onchange="saveAll()"></textarea>
                </div>
                <div class="input-group">
                    <label>解锁成功提示</label>
                    <input type="text" id="unlockSuccess" placeholder="输入解锁码成功后的提示语" onchange="saveAll()">
                </div>
            </div>

            <div class="card">
                <div class="card-title">使用说明</div>
                <div class="input-group">
                    <label>说明列表（每行一条）</label>
                    <textarea id="tipsText" rows="5" placeholder="每行显示为一个列表项" onchange="saveAll()"></textarea>
                    <div class="help-text">每行会显示为一个列表项</div>
                </div>
            </div>
        </div>

        <!-- Tab 3: 解锁码 -->
        <div class="tab-content" id="tab-codes">
            <div class="card">
                <div class="card-title">解锁码管理</div>
                <div class="alert alert-info" style="margin-bottom:16px;">
                    解锁码可让用户在次数用完后输入，无限查询。
                </div>
                <div class="input-row">
                    <div class="input-group" style="margin-bottom:0;">
                        <label>添加新解锁码</label>
                        <input type="text" id="newCode" placeholder="输入解锁码（如：VIP2024）" style="text-transform:uppercase;">
                    </div>
                    <button class="btn btn-sm" onclick="addCode()">添加</button>
                </div>
                <div class="code-list" id="codeList"></div>
            </div>
        </div>

        <!-- Tab 4: 修改密码 -->
        <div class="tab-content" id="tab-password">
            <div class="card">
                <div class="card-title">修改管理密码</div>
                <div class="input-group">
                    <label>当前密码</label>
                    <input type="password" id="oldPassword" placeholder="请输入当前密码">
                </div>
                <div class="password-row">
                    <div class="input-group">
                        <label>新密码</label>
                        <input type="password" id="newPassword" placeholder="请输入新密码">
                    </div>
                    <div class="input-group">
                        <label>确认新密码</label>
                        <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                    </div>
                </div>
                <button class="btn btn-block" onclick="changePassword()">修改密码</button>
            </div>
            <div style="text-align:center;color:#6b7b9c;font-size:0.8rem;margin-top:12px;">
                默认密码：kzy2024
            </div>
        </div>

        <div style="text-align:center;color:#4a5568;font-size:0.75rem;margin-top:30px;padding-bottom:20px;">
            修改会自动保存到服务器 · 刷新页面即可看到最新配置
        </div>
    </div>

    <script>
        const API = '/servo-cable/api';
        let adminPassword = '';
        let currentConfig = {};
        let saveTimer = null;
        let saveStatus = { el: null, timer: null };

        function showToast(msg, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'toast toast-' + type;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        async function loadConfig() {
            try {
                const resp = await fetch(API + '/config');
                if (!resp.ok) throw new Error('加载配置失败');
                const data = await resp.json();
                currentConfig = data;

                // 填充表单
                document.getElementById('limitEnabled').checked = data.limitEnabled !== false;
                document.getElementById('freeQueries').value = data.freeQueries || 1;
                document.getElementById('wechatId').value = data.wechatId || 'zzh250058';
                document.getElementById('siteTitle').value = data.siteTitle || '';
                document.getElementById('siteSubtitle').value = data.siteSubtitle || '';
                document.getElementById('modalTitle').value = data.modalTitle || '';
                document.getElementById('modalText').value = data.modalText || '';
                document.getElementById('unlockSuccess').value = data.unlockSuccess || '';
                document.getElementById('tipsText').value = data.tipsText || '';

                updateStatusAlert();
                renderCodes();
            } catch (e) {
                document.getElementById('statusAlert').textContent = '⚠️ 加载配置失败：' + e.message + '（服务器可能离线）';
                document.getElementById('statusAlert').className = 'alert alert-error';
            }
        }

        function updateStatusAlert() {
            const alert = document.getElementById('statusAlert');
            const enabled = document.getElementById('limitEnabled').checked;
            const free = document.getElementById('freeQueries').value;
            if (enabled) {
                alert.className = 'alert alert-warning';
                alert.innerHTML = '⚠️ 查询限制已启用，用户只能免费查询 <strong>' + free + '</strong> 次';
            } else {
                alert.className = 'alert alert-success';
                alert.innerHTML = '✅ 查询限制已关闭，所有用户可无限查询';
            }
        }

        function setSaveStatus(state) {
            let el = document.getElementById('saveStatusEl');
            if (!el) {
                el = document.createElement('span');
                el.id = 'saveStatusEl';
                el.className = 'saving-indicator';
                document.querySelector('.container > .header .subtitle').appendChild(el);
            }
            el.className = 'saving-indicator ' + state;
            el.textContent = state === 'saving' ? '保存中...' : state === 'saved' ? '✓ 已保存' : '';
            if (state === 'saved') {
                clearTimeout(el._timer);
                el._timer = setTimeout(() => { el.textContent = ''; }, 2000);
            }
        }

        async function saveAll() {
            if (!adminPassword) { showToast('请先输入密码登录', 'error'); return; }
            updateStatusAlert();

            const data = {
                password: adminPassword,
                limitEnabled: document.getElementById('limitEnabled').checked,
                freeQueries: parseInt(document.getElementById('freeQueries').value) || 1,
                wechatId: document.getElementById('wechatId').value || 'zzh250058',
                siteTitle: document.getElementById('siteTitle').value,
                siteSubtitle: document.getElementById('siteSubtitle').value,
                modalTitle: document.getElementById('modalTitle').value,
                modalText: document.getElementById('modalText').value,
                unlockSuccess: document.getElementById('unlockSuccess').value,
                tipsText: document.getElementById('tipsText').value
            };

            setSaveStatus('saving');
            try {
                const resp = await fetch(API + '/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (resp.status === 403) { showToast('密码错误，请重新登录', 'error'); return; }
                if (!resp.ok) throw new Error('保存失败');
                setSaveStatus('saved');
                showToast('✓ 配置已保存到服务器', 'success');
            } catch (e) {
                setSaveStatus('');
                showToast('保存失败：' + e.message, 'error');
            }
        }

        async function addCode() {
            if (!adminPassword) { showToast('请先输入密码', 'error'); return; }
            const input = document.getElementById('newCode');
            const code = input.value.trim().toUpperCase();
            if (!code) return;

            const codes = currentConfig.unlockCodes || [];
            if (codes.includes(code)) {
                showToast('该解锁码已存在', 'error');
                return;
            }

            const newCodes = [...codes, code];
            setSaveStatus('saving');
            try {
                const resp = await fetch(API + '/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: adminPassword, unlockCodes: newCodes })
                });
                if (resp.status === 403) { showToast('密码错误', 'error'); return; }
                if (!resp.ok) throw new Error('保存失败');
                currentConfig.unlockCodes = newCodes;
                renderCodes();
                setSaveStatus('saved');
                showToast('✓ 解锁码已添加', 'success');
                input.value = '';
            } catch (e) {
                setSaveStatus('');
                showToast('添加失败：' + e.message, 'error');
            }
        }

        async function removeCode(code) {
            if (!adminPassword) { showToast('请先输入密码', 'error'); return; }
            const codes = (currentConfig.unlockCodes || []).filter(c => c !== code);
            setSaveStatus('saving');
            try {
                const resp = await fetch(API + '/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: adminPassword, unlockCodes: codes })
                });
                if (resp.status === 403) { showToast('密码错误', 'error'); return; }
                if (!resp.ok) throw new Error('保存失败');
                currentConfig.unlockCodes = codes;
                renderCodes();
                setSaveStatus('saved');
                showToast('✓ 解锁码已删除', 'success');
            } catch (e) {
                setSaveStatus('');
                showToast('删除失败：' + e.message, 'error');
            }
        }

        function renderCodes() {
            const list = document.getElementById('codeList');
            const codes = currentConfig.unlockCodes || [];
            if (codes.length === 0) {
                list.innerHTML = '<div style="color:#6b7b9c;text-align:center;padding:12px;">暂无解锁码</div>';
                return;
            }
            list.innerHTML = codes.map(code => `
                <div class="code-item">
                    <span class="code-text">${code}</span>
                    <button class="btn btn-sm btn-danger" onclick="removeCode('${code}')">删除</button>
                </div>
            `).join('');
        }

        async function changePassword() {
            const oldPwd = document.getElementById('oldPassword').value;
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;

            if (!oldPwd) { showToast('请输入当前密码', 'error'); return; }
            if (!newPwd) { showToast('请输入新密码', 'error'); return; }
            if (newPwd !== confirmPwd) { showToast('两次输入的密码不一致', 'error'); return; }
            if (newPwd.length < 4) { showToast('密码至少4位', 'error'); return; }

            try {
                const resp = await fetch(API + '/admin/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd })
                });
                const result = await resp.json();
                if (resp.status === 403) { showToast('当前密码错误', 'error'); return; }
                if (!resp.ok) { showToast(result.error || '修改失败', 'error'); return; }
                adminPassword = newPwd;
                document.getElementById('oldPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                showToast('✓ 密码修改成功！', 'success');
            } catch (e) {
                showToast('修改失败：' + e.message, 'error');
            }
        }

        // ===== 登录流程 =====
        async function doLogin(password) {
            try {
                const resp = await fetch(API + '/admin/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const result = await resp.json();
                if (result.valid) {
                    adminPassword = password;
                    sessionStorage.setItem('servo_admin_session', 'true');
                    document.getElementById('loginOverlay') && document.getElementById('loginOverlay').remove();
                    loadConfig();
                } else {
                    const errEl = document.getElementById('loginError');
                    errEl.style.display = 'block';
                    setTimeout(() => { errEl.style.display = 'none'; }, 3000);
                }
            } catch (e) {
                const errEl = document.getElementById('loginError');
                if (errEl) {
                    errEl.textContent = '服务器连接失败：' + e.message;
                    errEl.style.display = 'block';
                }
            }
        }

        // 检查是否已登录（通过 sessionStorage）
        if (sessionStorage.getItem('servo_admin_session') !== 'true') {
            // 显示登录界面
            document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
                    <div style="width:100%;max-width:360px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:40px 32px;text-align:center;">
                        <div style="width:64px;height:64px;background:rgba(0,212,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;">🔐</div>
                        <h1 style="font-size:1.4rem;color:#00d4ff;margin-bottom:8px;">后台管理登录</h1>
                        <p style="color:#6b7b9c;font-size:0.85rem;margin-bottom:30px;">请输入管理密码</p>
                        <div style="margin-bottom:20px;text-align:left;">
                            <label style="display:block;color:#8b9dc3;font-size:0.85rem;margin-bottom:8px;">管理密码</label>
                            <input type="password" id="loginPwd" placeholder="请输入密码" style="width:100%;padding:12px 16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:1rem;outline:none;" onkeypress="if(event.key==='Enter')doLogin(document.getElementById('loginPwd').value)">
                        </div>
                        <button onclick="doLogin(document.getElementById('loginPwd').value)" style="width:100%;padding:12px;background:linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%);border:none;border-radius:8px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;">登录</button>
                        <div id="loginError" style="color:#ff6b6b;font-size:0.85rem;margin-top:12px;display:none;">密码错误，请重试</div>
                        <div style="margin-top:24px;">
                            <a href="/servo-cable/" style="color:#6b7b9c;font-size:0.85rem;text-decoration:none;">← 返回首页</a>
                        </div>
                    </div>
                </div>
            `;
        } else {
            // 已登录，直接加载
            adminPassword = sessionStorage.getItem('servo_admin_session_pwd') || 'kzy2024';
            loadConfig();
        }

        function logout() {
            sessionStorage.removeItem('servo_admin_session');
            sessionStorage.removeItem('servo_admin_session_pwd');
            window.location.reload();
        }
    </script>
