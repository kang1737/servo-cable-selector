<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #0a0e1a;
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 360px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
        }
        .login-icon {
            width: 64px; height: 64px;
            background: rgba(0,212,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }
        h1 { font-size: 1.4rem; color: #00d4ff; margin-bottom: 8px; }
        .subtitle { color: #6b7b9c; font-size: 0.85rem; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; color: #8b9dc3; font-size: 0.85rem; margin-bottom: 8px; }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus { border-color: #00d4ff; }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,212,255,0.25); }
        
        .error { color: #ff6b6b; font-size: 0.85rem; margin-top: 12px; display: none; }
        
        .back-link { margin-top: 24px; }
        .back-link a { color: #6b7b9c; font-size: 0.85rem; text-decoration: none; }
        .back-link a:hover { color: #00d4ff; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-icon">🔐</div>
        <h1>后台管理登录</h1>
        <p class="subtitle">请输入管理密码</p>
        
        <div class="input-group">
            <label for="password">管理密码</label>
            <input type="password" id="password" placeholder="请输入密码" onkeypress="if(event.key==='Enter')login()">
        </div>
        
        <button class="btn" onclick="login()">登录</button>
        
        <div class="error" id="errorMsg">密码错误，请重试</div>
        
        <div class="back-link">
            <a href="/servo-cable/">← 返回首页</a>
        </div>
    </div>

    <script>
        // 默认密码（首次使用）
        const DEFAULT_PASSWORD = 'kzy2024';
        
        function login() {
            const input = document.getElementById('password');
            const errorMsg = document.getElementById('errorMsg');
            const password = input.value.trim();
            
            if (!password) {
                input.focus();
                return;
            }
            
            // 检查密码
            const savedPassword = localStorage.getItem('servo_admin_password') || DEFAULT_PASSWORD;
            
            if (password === savedPassword) {
                // 登录成功，保存会话
                sessionStorage.setItem('servo_admin_logged_in', 'true');
                window.location.href = 'admin-panel.html';
            } else {
                errorMsg.style.display = 'block';
                input.value = '';
                input.focus();
                setTimeout(() => { errorMsg.style.display = 'none'; }, 3000);
            }
        }
        
        // 检查是否已登录
        if (sessionStorage.getItem('servo_admin_logged_in') === 'true') {
            window.location.href = 'admin-panel.html';
        }
    </script>
</body>
</html>
