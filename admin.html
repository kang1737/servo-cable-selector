<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #0a0e1a;
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 360px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
        }
        .login-icon {
            width: 64px; height: 64px;
            background: rgba(0,212,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }
        h1 { font-size: 1.4rem; color: #00d4ff; margin-bottom: 8px; }
        .subtitle { color: #6b7b9c; font-size: 0.85rem; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; color: #8b9dc3; font-size: 0.85rem; margin-bottom: 8px; }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus { border-color: #00d4ff; }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,212,255,0.25); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .error { color: #ff6b6b; font-size: 0.85rem; margin-top: 12px; display: none; }
        
        .back-link { margin-top: 24px; }
        .back-link a { color: #6b7b9c; font-size: 0.85rem; text-decoration: none; }
        .back-link a:hover { color: #00d4ff; }
        
        .server-error { color: #ffd93d; font-size: 0.85rem; margin-top: 12px; text-align: left; padding: 8px 12px; background: rgba(255,217,61,0.1); border-radius: 6px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-icon">🔐</div>
        <h1>后台管理登录</h1>
        <p class="subtitle">请输入管理密码</p>
        
        <div class="input-group">
            <label for="password">管理密码</label>
            <input type="password" id="password" placeholder="请输入密码" onkeypress="if(event.key==='Enter')doLogin()" autocomplete="current-password">
        </div>
        
        <button class="btn" id="loginBtn" onclick="doLogin()">登录</button>
        
        <div class="error" id="errorMsg">密码错误，请重试</div>
        <div class="server-error" id="serverError"></div>
        
        <div class="back-link">
            <a href="/servo-cable/">← 返回首页</a>
        </div>
    </div>

    <script>
        const API = '/servo-cable/api';
        
        async function doLogin() {
            const password = document.getElementById('password').value.trim();
            if (!password) return;
            
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '验证中...';
            
            try {
                const resp = await fetch(API + '/admin/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const result = await resp.json();
                
                if (result.valid) {
                    // 保存会话
                    sessionStorage.setItem('servo_admin_session', 'true');
                    sessionStorage.setItem('servo_admin_session_pwd', password);
                    window.location.href = 'admin-panel.html';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                    setTimeout(() => { document.getElementById('errorMsg').style.display = 'none'; }, 3000);
                }
            } catch (e) {
                const el = document.getElementById('serverError');
                el.textContent = '⚠️ 服务器连接失败：' + e.message + '（请确认后台服务已启动）';
                el.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }
        
        // 检查是否已登录
        if (sessionStorage.getItem('servo_admin_session') === 'true') {
            window.location.href = 'admin-panel.html';
        }
    </script>
</body>
</html>
